# Example imgserve config. Start with: imgserve -config imgserve.yaml
# Flags given on the command line override these values.
# Relative paths are resolved against the directory holding this file.

port: 8080
logLevel: INFO

# Optional: cache transformed images. Each directory gets its own subdirectory.
# cacheDir: /var/cache/imgserve

# Optional: serve HTTPS directly.
# certFile: /etc/imgserve/my.images.net.cer
# certKeyFile: /etc/imgserve/my.images.net.key

# Each directory is served at /{name}/{width} and /{name}/{width}/{height}.
# name defaults to the directory's base name. The first directory is also
# served at /{width} and /{width}/{height}.
directories:
  - path: /mnt/media/photos          # served at /photos
  - path: /mnt/images/screensaver
    name: ss                         # served at /ss
