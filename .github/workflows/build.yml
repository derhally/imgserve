name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Read the version from go.mod: setup-go v6+ pins GOTOOLCHAIN=local, so a
    # hardcoded version that trails the go directive is a hard build failure.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Run Mage
      uses: magefile/mage-action@v4
      with:
        version: latest
        args: build:linux
